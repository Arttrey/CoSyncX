name: Build experimental portable app

on:
  workflow_dispatch:

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'pyinstaller>=6.15,<7'
      - run: python -c "from pathlib import Path; Path('dist').mkdir()"
      - run: python tools/build_portable.py --output dist/cosyncx
      - run: python -c "import os, pathlib, subprocess; p = pathlib.Path('dist/cosyncx') / ('cosyncx.exe' if os.name == 'nt' else 'cosyncx'); subprocess.run(['python', 'tools/smoke_portable.py', str(p.resolve())], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: cosyncx-${{ matrix.os }}
          path: dist/cosyncx/
