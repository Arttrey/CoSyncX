[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosyncx"
version = "0.1.0a1"
description = "Experimental local companion for Syncthing and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["cryptography>=42"]

[project.scripts]
cosyncx = "nexus_sync:main"
nexus-sync = "nexus_sync:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["nexus_sync", "mock_auto_receiver", "mock_chat_preview", "mock_chat_sync", "mock_git_sync", "mock_ignore_probe", "mock_loopback_proxy", "mock_publications", "mock_secret_sync", "mock_syncthing_status"]
