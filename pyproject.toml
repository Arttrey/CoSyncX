[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosyncx"
version = "0.1.1a1"
description = "Experimental local companion for Syncthing and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["cryptography>=42"]

[project.scripts]
cosyncx = "cosyncx:main"
cosyncx-engine = "cosync_engine:main"
cosyncx-build-engine = "cosync_vendor:main"
nexus-sync = "nexus_sync:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cosyncx_gui"]
py-modules = ["nexus_sync", "cosyncx", "cosync_engine", "cosync_proxy", "cosync_vendor", "mock_auto_receiver", "mock_chat_preview", "mock_chat_sync", "mock_git_sync", "mock_ignore_probe", "mock_loopback_proxy", "mock_publications", "mock_secret_sync", "mock_syncthing_status"]

[tool.setuptools.package-data]
cosyncx_gui = ["LICENSE", "UPSTREAM.md", "default/index.html", "default/assets/css/*.css", "default/assets/lang/*.json"]
